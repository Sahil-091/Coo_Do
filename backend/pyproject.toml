[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic generates migrations/versions/*.py from its own template
# (script.py.mako) — linting generated code against our style rules just
# creates perpetual diffs every time a new migration is generated.
extend-exclude = ["db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501", # line length handled by formatter/reviewer judgment, not a hard gate at Phase 0
  "B008", # FastAPI's `Depends(...)` in argument defaults is the framework's actual DI
          # pattern — FastAPI re-invokes it per-request, it is NOT the mutable-default
          # bug this rule generally guards against. Standard project-wide ignore for
          # any FastAPI codebase (see FastAPI's own docs on the Depends() pattern).
]
